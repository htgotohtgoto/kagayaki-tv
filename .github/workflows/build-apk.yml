name: Build Kagayaki APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-fix folder structure if nested
        run: |
          echo "=== Current Files ==="
          find . -maxdepth 5 -not -path '*/.*'
          # もしフォルダの奥にズレて作られてしまっていたら、正しい位置に自動で移動して修復する
          f_settings=$(find . -name "settings.gradle" | head -n 1)
          if [ -n "$f_settings" ] && [ "$f_settings" != "./settings.gradle" ]; then
            cp "$f_settings" ./settings.gradle
          fi
          f_manifest=$(find . -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$f_manifest" ] && [ "$f_manifest" != "./app/src/main/AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            cp "$f_manifest" ./app/src/main/AndroidManifest.xml
          fi
          f_main=$(find . -name "MainActivity.java" | head -n 1)
          if [ -n "$f_main" ] && [ "$f_main" != "./app/src/main/java/jp/kagayaki/signage/MainActivity.java" ]; then
            mkdir -p app/src/main/java/jp/kagayaki/signage
            cp "$f_main" ./app/src/main/java/jp/kagayaki/signage/MainActivity.java
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KagayakiSignage-APK
          path: app/build/outputs/apk/debug/app-debug.apk
