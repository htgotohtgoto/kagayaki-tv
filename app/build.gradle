plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.kagayaki.signage'
    compileSdk 34

    defaultConfig {
        applicationId "jp.kagayaki.signage"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
